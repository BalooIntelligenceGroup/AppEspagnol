# Génère la voix de synthèse tunisienne à chaque changement de tts/phrases.json, puis l'ajoute à la branche.
# Netlify publie ensuite automatiquement la branche tounsi.
name: Voix tunisienne
on:
  push:
    branches: [tounsi]
    paths: ['tts/**', '.github/workflows/voix.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voix-tounsi
  cancel-in-progress: false
jobs:
  voix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --upgrade edge-tts
      - run: python tts/generate.py
      - name: Ajouter les fichiers audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/tts
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Voix de synthèse tunisienne mise à jour"
          git pull --rebase origin tounsi
          git push origin HEAD:tounsi
