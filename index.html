<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#169C98">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>¡Hola Lola!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen kids' app, single bright "lagoon & sunflower" world, centered column max 520px, chunky tappable tiles */
:root{
  --bg:#E6F6F0; --bg2:#D3EEE5; --card:#FFFFFF; --ink:#16394A; --muted:#55767F; --line:#C4E2D8;
  --lagoon:#169C98; --lagoon-d:#0E7673; --sun:#FFC93C; --sun-d:#E0A510; --coral:#FF6F5E; --coral-d:#D9503F;
  --good:#23A55A; --good-bg:#DDF6E6; --bad:#E0464C; --bad-bg:#FDE3E3; --lock:#A9C3BC;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
button.lola{border:0;cursor:pointer;padding:0}
.ava{position:relative;display:inline-grid;place-items:center;line-height:1}
.ava-h{position:absolute;top:-.46em;left:50%;transform:translateX(-50%);font-size:.58em}
.ava-f{position:absolute;top:.2em;left:50%;transform:translateX(-50%);font-size:.42em}
.ava-x{position:absolute;right:-.42em;bottom:-.12em;font-size:.5em}
.lola.big .ava{font-size:70px}
img.fx{width:1.18em;height:1.18em;object-fit:contain;vertical-align:-.22em;display:inline-block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.pictxt{display:inline-block;max-width:100%;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.12;color:var(--lagoon-d);text-align:center;overflow-wrap:anywhere;padding:4px 6px}
.opts.pics .pictxt,.mpic .pictxt,.mcard .pictxt,.sticker .pictxt{font-size:15px;padding:2px}
.bubble-f .pictxt{font-size:11px;line-height:1.05;padding:2px}
.trad{background:var(--card);border-radius:14px;padding:8px 12px;margin:2px 0 10px;text-align:left;color:var(--ink)}
.trad p{margin:2px 0!important;font-size:16px;font-weight:700;line-height:1.35}
.frq{display:block;font-size:15px;font-weight:700;color:var(--muted);margin-top:4px;line-height:1.3}
.frq.big{font-size:18px;text-align:center;background:var(--card);border-radius:14px;padding:8px 12px;margin:10px 0 0;color:var(--ink)}
.custom{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.custom label{font-weight:800;font-size:15px}
.custom input{width:88px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:18px;text-align:center;padding:0 8px}
.custom.on input{border-color:var(--sun);background:var(--sun)}
.custom input.bad{border-color:var(--bad)}
.custom span{font-weight:700;color:var(--muted)}
.custom .tool{min-height:44px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg.three button{font-size:22px}
.tuto{min-height:300px;justify-content:center}
.tuto .tbig{font-size:76px;line-height:1.1}
.tuto .tbig .ava{font-size:76px}
#totop{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:52px;height:52px;border-radius:50%;border:0;background:var(--lagoon);color:#fff;font-size:28px;font-weight:800;box-shadow:0 4px 0 var(--lagoon-d),0 6px 16px rgba(0,0,0,.18);cursor:pointer}
#totop[hidden]{display:none}
.seg.two{grid-template-columns:repeat(2,1fr)}
.limit{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.limit b{font-size:16px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{min-width:0;min-height:52px;border-radius:14px;background:var(--bg2);font-weight:800;font-size:18px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;box-shadow:0 3px 0 var(--line)}
.seg button small{font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--sun);box-shadow:0 3px 0 var(--sun-d)}
.seg button.on small{color:var(--ink)}
.funbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.fun{background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:14px}
.fun span{font-size:30px;line-height:1.1}
.eplist{display:flex;flex-direction:column;gap:10px}
.epi{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:12px 14px;text-align:left;font-size:20px}
.epi.lock{opacity:.55}
.epn{flex:none;width:46px;height:46px;border-radius:14px;background:var(--bg2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px}
.ept{flex:1;min-width:0;display:flex;flex-direction:column}
.ept b{font-family:var(--f-display);font-size:19px;line-height:1.15}
.ept small{font-size:14px;font-weight:700;color:var(--muted)}
.panel{background:var(--card);border-radius:26px;box-shadow:0 6px 0 var(--line);padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;margin:8px 0 14px}
.pscene{display:flex;align-items:center;justify-content:center;gap:14px;font-size:64px;line-height:1.1;flex-wrap:wrap}
.pscene .pg{font-size:56px}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--lagoon)}
.kara{background:var(--card);border-radius:22px;box-shadow:0 5px 0 var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.kl{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.3;color:var(--muted);transition:color .2s,transform .2s}
.kl.on{color:var(--lagoon-d);transform:scale(1.03);transform-origin:left}
.kl.me{color:var(--coral-d)}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.sticker{aspect-ratio:1;border-radius:20px;background:var(--bg2);border:3px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;color:var(--muted);max-width:100%}
.sticker span{font-size:34px;line-height:1}
.sticker.on{background:var(--card);border:3px solid var(--sun);box-shadow:0 4px 0 var(--sun-d);color:var(--ink);transform:rotate(-2deg)}
.sticker.on:nth-child(2n){transform:rotate(2deg)}
.sticker.on .swatch{width:38px;height:38px;border-radius:10px}
.sticker b{font-size:13px;text-align:center;line-height:1.1;padding:0 4px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.item{background:var(--card);border-radius:18px;border:3px solid transparent;box-shadow:0 4px 0 var(--line);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.item span{font-size:34px;line-height:1.1}
.item b{font-size:14px;line-height:1.15;text-align:center}
.item small{font-size:13px;font-weight:800;color:var(--muted)}
.item.on{border-color:var(--good);background:var(--good-bg)}
.item.poor{opacity:.6}
.ghead{display:flex;justify-content:space-between;font-weight:800;font-size:17px}
.sky{position:relative;height:430px;overflow:hidden;border-radius:24px;background:linear-gradient(var(--bg2),var(--card));margin-top:6px}
.bubble-f{position:absolute;top:-96px;width:88px;height:88px;border-radius:50%;background:var(--card);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;font-size:48px;animation-name:fall2;animation-timing-function:linear;animation-fill-mode:forwards}
.bubble-f .swatch{width:56px;height:56px;border-radius:50%}
.bubble-f.sel-good{border-color:var(--good);background:var(--good-bg)}
.bubble-f.sel-bad{border-color:var(--bad);background:var(--bad-bg)}
@keyframes fall2{from{top:-96px}to{top:calc(100% + 4px)}}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.mcard{aspect-ratio:1;border-radius:18px;background:var(--lagoon);box-shadow:0 5px 0 var(--lagoon-d);color:#fff;font-size:34px;display:grid;place-items:center;max-width:100%;padding:4px}
.mcard.up{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);font-size:44px}
.mcard.up b{font-size:16px;line-height:1.15;overflow-wrap:anywhere}
.mcard.ok{background:var(--good-bg);box-shadow:0 5px 0 var(--good)}
.mcard .swatch{width:60%;height:60%;border-radius:12px}
.rank{display:flex;align-items:center;gap:10px;font-size:17px}
.rank .re{font-size:26px}
.rank b{flex:1;min-width:0}
.rank .rp{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.deco{text-align:center;font-size:20px;letter-spacing:6px;margin-top:10px;opacity:.85}
.badge{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:999px;background:#fff;color:var(--coral-d);font-size:15px;font-family:var(--f-body)}
.node.ev .disc{background:var(--sun);box-shadow:0 7px 0 var(--sun-d);font-size:36px}
.node.ev.done .disc{background:var(--good);box-shadow:0 7px 0 #17803F}
.node.ev.locked .disc{background:var(--lock);box-shadow:0 7px 0 #8FAAA3}
.evalhead{background:var(--sun);border-radius:14px;padding:8px 12px;font-weight:800;text-align:center}
.misslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;width:100%}
.big2{min-height:84px;font-size:22px}
.themes{display:grid;gap:12px;width:100%}
.thcard{display:flex;align-items:center;gap:14px;background:var(--tb);border:4px solid transparent;border-radius:22px;padding:12px 14px;text-align:left;box-shadow:0 5px 0 var(--tl)}
.thcard.on{border-color:var(--tl)}
.thmas{flex:none;width:72px;height:72px;border-radius:50%;background:var(--ts);display:grid;place-items:center;font-size:44px}
.thtxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.thtxt b{font-family:var(--f-display);font-size:22px;line-height:1.1}
.thtxt small{font-weight:700;color:var(--muted)}
.thdeco{font-size:18px;letter-spacing:3px}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;width:100%}
.pcard{background:var(--pb,var(--card));border:4px solid transparent;border-radius:22px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 var(--pc,var(--line))}
.pcard.cur{border-color:var(--pc)}
.pcard.add{background:var(--card);box-shadow:0 5px 0 var(--line)}
.pcard b{font-family:var(--f-display);font-size:20px}
.pcard small{font-weight:700;color:var(--muted);font-size:13px}
.pav{width:64px;height:64px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:38px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats div{background:var(--bg);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats small{font-weight:700;color:var(--muted);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:4px}
.barc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-width:0}
.barc i{display:block;width:100%;max-width:28px;min-height:3px;border-radius:6px 6px 2px 2px;background:var(--lagoon)}
.barc .bv{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.barc small{font-size:12px;font-weight:800;color:var(--muted)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:14px 24px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun-d);outline-offset:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:0 22px;border-radius:18px;font-family:var(--f-display);font-weight:800;font-size:22px;
  background:var(--lagoon);color:#fff;box-shadow:0 5px 0 var(--lagoon-d);transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--lagoon-d)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-d)}
.btn.coral{background:var(--coral);box-shadow:0 5px 0 var(--coral-d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn[disabled]{background:var(--lock);box-shadow:0 5px 0 #8FAAA3;opacity:.8}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}

/* Home */
.top{display:flex;align-items:center;gap:12px}
.lola{width:68px;height:68px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 60%,#FFE7A0 0 55%,var(--sun) 56%);display:grid;place-items:center;font-size:42px}
.lola.big{width:120px;height:120px;font-size:76px}
.hello{flex:1;min-width:0}
.hello small{color:var(--muted);font-weight:700;font-size:14px;display:block}
.hello h1{font-size:30px}
.icon-btn{width:48px;height:48px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:22px;display:grid;place-items:center;flex:none}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums}
.goal{margin-top:14px;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 4px 0 var(--line)}
.goal-h{display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.goal-h span:last-child{color:var(--muted)}
.bar{height:14px;background:var(--bg2);border-radius:999px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:999px;transition:width .4s}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.quick .btn{font-size:19px;min-height:62px;padding:0 10px}
.quick .wide{grid-column:1/-1}
.node .disc.conv{background:var(--coral);box-shadow:0 7px 0 var(--coral-d)}
.ctag{font-size:12px;font-weight:800;color:var(--coral-d);background:#FFE4E0;border-radius:999px;padding:2px 10px}
.map{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:26px;padding-bottom:20px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;width:150px}
.node .disc{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:var(--lagoon);box-shadow:0 7px 0 var(--lagoon-d);transition:transform .08s}
.node:active .disc{transform:translateY(4px)}
.node.done .disc{background:var(--sun);box-shadow:0 7px 0 var(--sun-d)}
.node.locked .disc{background:var(--lock);box-shadow:0 7px 0 #8FAAA3;filter:grayscale(.7);font-size:30px}
.node.current .disc{animation:bob 1.6s ease-in-out infinite;outline:5px solid #fff;outline-offset:3px}
.node b{font-family:var(--f-display);font-size:18px;line-height:1.1;text-align:center}
.node em{font-style:normal;font-size:13px;color:var(--muted);font-weight:700;text-align:center}
.stars{font-size:16px;letter-spacing:2px;min-height:20px}
.start-tag{background:var(--coral);color:#fff;font-weight:800;font-size:13px;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
@keyframes bob{50%{transform:translateY(-6px)}}

/* Lesson */
.lbar{display:flex;align-items:center;gap:12px}
.lbar .bar{flex:1;margin:0;height:18px}
.lbar .bar>i{background:var(--good)}
.stage{flex:1;display:flex;flex-direction:column;gap:18px;padding-top:18px}
.ask{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.15}
.ask small{display:block;font-family:var(--f-body);font-size:15px;color:var(--muted);font-weight:700;margin-top:2px}
.card{background:var(--card);border-radius:26px;padding:22px 18px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pic{font-size:96px;line-height:1.1}
.swatch{width:110px;height:110px;border-radius:28px;border:4px solid rgba(0,0,0,.08)}
.es{font-family:var(--f-display);font-weight:800;font-size:38px;color:var(--lagoon-d);line-height:1.1}
.fr{color:var(--muted);font-weight:700}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tool{min-height:52px;padding:0 16px;border-radius:16px;background:var(--bg);font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.tool.mic{background:var(--coral);color:#fff;box-shadow:0 3px 0 var(--coral-d)}
.tool.mic.on{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,111,94,.6)}100%{box-shadow:0 0 0 18px rgba(255,111,94,0)}}
.heard{min-height:22px;font-weight:700;color:var(--muted);text-align:center;font-size:15px}
.speaker{width:120px;height:120px;border-radius:32px;background:var(--lagoon);color:#fff;font-size:56px;display:grid;place-items:center;margin:0 auto;box-shadow:0 7px 0 var(--lagoon-d)}
.speaker:active{transform:translateY(4px);box-shadow:0 3px 0 var(--lagoon-d)}
.opts{display:grid;gap:12px}
.opts.pics{grid-template-columns:repeat(3,1fr)}
.opt{background:var(--card);border-radius:20px;box-shadow:0 5px 0 var(--line);border:3px solid transparent;padding:14px 12px;font-weight:800;font-size:20px;text-align:left;display:flex;align-items:center;gap:10px;min-height:64px}
.opts.pics .opt{justify-content:center;font-size:58px;aspect-ratio:1;padding:6px;max-width:100%}
.opts.pics .opt .swatch{width:70%;height:70%;border-radius:18px}
.opt.sel-good{border-color:var(--good);background:var(--good-bg)}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt .sub{display:block;font-size:14px;color:var(--muted);font-weight:700}
.chat{display:flex;gap:10px;align-items:flex-end}
.bubble{background:var(--card);border-radius:22px 22px 22px 6px;padding:14px 16px;box-shadow:0 5px 0 var(--line);flex:1;min-width:0}
.bubble .es{font-size:25px}
.bubble .prop{font-size:40px;line-height:1.2}
.foot{position:sticky;bottom:0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));margin-top:auto}
.fb{border-radius:22px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
.fb.good{background:var(--good-bg)} .fb.bad{background:var(--bad-bg)}
.fb h3{font-size:26px} .fb.good h3{color:var(--good)} .fb.bad h3{color:var(--bad)}
.fb p{margin:0;font-weight:700}
.fb .btn{background:var(--good);box-shadow:0 5px 0 #17803F}
.fb.bad .btn{background:var(--bad);box-shadow:0 5px 0 #A92F34}
@keyframes up{from{transform:translateY(20px);opacity:.3}}

/* Result, dico, settings */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.bigstars{font-size:56px;letter-spacing:6px}
.bigstars .off{filter:grayscale(1);opacity:.3}
.xp{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--lagoon-d)}
.say{font-weight:700;color:var(--muted);max-width:30ch}
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.head h2{font-size:28px;flex:1}
.dico{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.dw{background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.dw span{font-size:40px;line-height:1.1}
.dw .swatch{width:44px;height:44px;border-radius:12px}
.dw b{font-size:15px;color:var(--lagoon-d)}
.dw small{font-size:12px;color:var(--muted);font-weight:700}
.dunit{font-family:var(--f-display);font-size:19px;margin:18px 0 8px}
.empty{background:var(--card);border-radius:20px;padding:20px;text-align:center;font-weight:700;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
.field input{font:inherit;font-size:22px;padding:14px 16px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
.set{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800}
.sw{width:58px;height:34px;border-radius:999px;background:var(--lock);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--good)} .sw.on::after{left:28px}
.note{font-size:14px;color:var(--muted);font-weight:700;margin:0}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.newver{margin-top:14px;background:var(--sun);color:var(--ink);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 4px 0 var(--sun-d)}
.newver>div{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
.newver b{font-family:var(--f-display);font-size:20px}
.newver span{font-weight:700;font-size:15px}
.newver .tool{background:var(--card);box-shadow:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:10px;min-width:0}
.opt.mword{justify-content:center;text-align:center;font-size:18px;min-height:72px;padding:8px;overflow-wrap:anywhere}
.opt.mpic{justify-content:center;font-size:42px;min-height:72px;padding:6px}
.opt.mpic .swatch{width:48px;height:48px;border-radius:12px}
.opt.picked{border-color:var(--sun-d);background:#FFF4D1}
.opts.tf{grid-template-columns:1fr 1fr}
.opts.tf .opt{justify-content:center;font-size:24px;min-height:72px}
.buildtop{display:flex;align-items:center;justify-content:center;gap:16px}
.buildtop .prop{font-size:56px;line-height:1}
.speaker.sm{width:84px;height:84px;font-size:40px;margin:0;border-radius:24px}
.buildline{min-height:72px;border-bottom:3px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 2px}
.buildline.ok{border-color:var(--good)} .buildline.ko{border-color:var(--bad)}
.buildline .ph{color:var(--muted);font-weight:700;font-size:15px}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{background:var(--card);border-radius:14px;box-shadow:0 4px 0 var(--line);padding:10px 14px;font-weight:800;font-size:20px;border:2px solid var(--line)}
.tile.gone{visibility:hidden}
textarea.code{font:600 13px/1.4 ui-monospace,Menlo,monospace;width:100%;box-sizing:border-box;min-height:84px;padding:10px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);overflow-wrap:anywhere;resize:vertical}
.tier{align-self:stretch;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--ink);color:#fff;border-radius:18px;padding:10px 14px;margin:6px 0;text-align:center}
.tier b{font-family:var(--f-display);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.tier span{font-weight:700;font-size:14px;opacity:.85}
.gapline{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.35;color:var(--ink);text-wrap:balance}
.hole{display:inline-block;min-width:72px;margin:0 6px;padding:0 8px;border-bottom:4px dashed var(--lagoon);color:var(--lagoon-d)}
.hole.full{border-bottom-style:solid;border-color:var(--good);background:var(--good-bg);border-radius:10px;color:var(--good)}
.opts.words3{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.opts.words3 .opt{justify-content:center;text-align:center;font-size:21px}
.heard.nomic{background:var(--bg2);border-radius:16px;padding:10px 14px;color:var(--ink)}
.score{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 4px 0 var(--line);text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.score-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.score-h b{font-family:var(--f-display);font-size:20px}
.score.ok .score-h b{color:var(--good)} .score.ko .score-h b{color:var(--bad)}
.score-h span{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.meter{position:relative;height:14px;border-radius:999px;background:var(--bg2);overflow:visible}
.meter i{display:block;height:100%;border-radius:999px;background:var(--bad);transition:width .5s}
.score.ok .meter i{background:var(--good)}
.meter em{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.words{font-family:var(--f-display);font-weight:800;font-size:22px;display:flex;flex-wrap:wrap;gap:4px 8px}
.wok{color:var(--good)} .wko{color:var(--bad);text-decoration:underline wavy;text-underline-offset:5px}
.heardtxt{font-size:14px;color:var(--muted)}
.tip{background:var(--bg);border-radius:12px;padding:8px 12px;font-size:15px}
#warn{position:fixed;left:0;right:0;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:15px;

#warn span{flex:1 1 240px;min-width:0}
#warn b:first-child{flex-basis:100%}
#warn .tool{color:var(--ink);background:var(--sun);box-shadow:none;min-height:44px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.es{font-size:32px}.pic{font-size:80px}.hello h1{font-size:26px}}

/* ---------- Analyse de la prononciation ----------
   La reconnaissance espagnole (es-ES) transcrit ce qu'elle comprend. On compare mot par mot avec la phrase attendue,
   on pondère par la confiance du moteur, et on ne valide que si tous les mots sont reconnus. */
const PASS=75,ART=['el','la','los','las','un','una'];
const nw=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}
const TIPS=[
 [/rr|^r/,'Le R espagnol se roule avec le bout de la langue : « rrr », comme un petit moteur !'],
 [/j|g[ei]/,'Le J se dit au fond de la gorge, comme quand on souffle sur ses lunettes : « kh ».'],
 [/ñ/,'Le Ñ se dit « gn », comme dans « montagne ».'],
 [/ll/,'Le LL se dit « y », comme dans « yoyo ».'],
 [/z|c[ei]/,'Le Z (et le C devant E ou I) se dit avec la langue entre les dents.'],
 [/r/,'Le R espagnol se fait avec le bout de la langue derrière les dents, pas dans la gorge.'],
 [/^h/,'Le H ne se prononce jamais en espagnol.'],
 [/v/,'Le V espagnol se dit presque comme un B.'],
 [/u/,'Le U espagnol se dit toujours « ou ».'],
 [/e/,'Le E espagnol se dit toujours « é » : perro se dit « pé-rro ».']];
function tipFor(ws){for(const w of ws)for(const [re,t] of TIPS)if(re.test(w))return t;return 'Écoute '+G().es+' en lent 🐢, puis répète syllabe par syllabe.'}
function analyze(alts,target){
  const raw=fill(target).replace(/[¿?¡!.,«»:—]/g,' ').split(/\s+/).filter(Boolean);
  let words=raw.filter(w=>!ART.includes(w.toLowerCase())).map(w=>({raw:w,n:nw(w)}));
  if(!words.length)words=raw.map(w=>({raw:w,n:nw(w)}));
  const T=words.map(w=>w.n).join(' ');
  let best={score:0,alt:alts[0]?alts[0].t:'',words:words.map(w=>({raw:w.raw,ok:false}))};
  alts.slice(0,1).forEach((a,k)=>{ /* seule la meilleure transcription compte : pas de rattrapage par les variantes */
    const aw=a.t.split(/\s+/).map(nw).filter(x=>x&&!ART.includes(x)),A=aw.join(' ');
    const sim=Math.max(0,1-lev(A,T)/Math.max(A.length,T.length,1));
    const wk=words.map(w=>({raw:w.raw,ok:aw.some(x=>x===w.n||(w.n.length>5&&lev(x,w.n)<=1))}));
    let sc=0.5*sim+0.5*wk.filter(x=>x.ok).length/wk.length;
    if(k===0&&a.c>0)sc*=0.8+0.2*Math.min(1,a.c/0.85);
    if(k>0)sc*=0.9;
    sc=Math.round(sc*100);
    if(sc>best.score)best={score:sc,alt:a.t,words:wk};
  });
  const miss=best.words.filter(w=>!w.ok);
  best.pass=best.score>=PASS&&miss.length<=(words.length>=5?1:0);
  best.tip=tipFor((miss.length?miss:best.words).map(w=>w.raw.toLowerCase()));
  return best;
}
function scoreHTML(r){
  const lbl=r.pass?(r.score>=90?'Excellent accent !':'Bien prononcé !'):r.score>=55?'Presque… pas encore validé':'Pas encore validé';
  return `<div class="score ${r.pass?'ok':'ko'}"><div class="score-h"><b>${lbl}</b><span>${r.score}/100</span></div>
    <div class="meter"><i style="width:${r.score}%"></i><em style="left:${PASS}%"></em></div>
    <div class="words">${r.words.map(w=>`<span class="${w.ok?'wok':'wko'}">${esc(w.raw)}</span>`).join(' ')}</div>
    ${r.alt?`<div class="heardtxt">${G().es} a compris : « ${esc(r.alt)} »</div>`:''}
    ${r.pass?'':`<div class="tip">💡 ${esc(r.tip)}</div>`}</div>`;
}

function evalNode(t,isCur){

/* ---------- Construction d'une leçon ---------- */
/* Les exercices (après la découverte des mots) sont mélangés : ordre différent pour chaque enfant
   et jamais deux fois de suite le même enchaînement (S.seq garde le dernier, par leçon). */
const sigOf=s=>s.t+':'+(s.w?s.w.es:s.g?s.g.s:s.d?s.d.l:s.sent||(s.ws||[]).map(w=>w.es).join(','));
function mix(key,head,rest){
  S.seq=S.seq||{};const old=S.seq[key];let steps,sig;
  for(let n=0;n<8;n++){steps=head.concat(shuffle(rest.slice()));sig=steps.map(sigOf).join('|');if(sig!==old)break}
  S.seq[key]=sig;return steps;
}
const kindFor=(w,conv)=>Math.random()<.5?'pick':(conv?'mean':'listen');
const uniqPic=arr=>{const seen=new Set();return arr.filter(w=>!seen.has(w.e)&&seen.add(w.e))};
function optsFor(w,pool){return shuffle([w,...uniqPic(shuffle(pool.filter(x=>x.es!==w.es&&x.e!==w.e))).slice(0,2)])}
const gapStep=g=>({t:'gap',g:{s:g[0],a:g[1],e:g[3]},opts:shuffle([g[1],...g[2]])});
/* Associer les paires : 4 mots ↔ 4 images */
function matchStep(pool){const ws=uniqPic(shuffle(pool.slice())).slice(0,4);return {t:'match',ws,left:shuffle(ws.slice()),right:shuffle(ws.slice()),done:[],sel:null,err:0,bad:null}}
/* Vrai ou faux : la phrase entendue correspond-elle à l'image ? */
function tfSteps(pool,n){return shuffle(pool.slice()).slice(0,n).map(w=>{
  const others=pool.filter(x=>x.e!==w.e);const truth=!others.length||Math.random()<.5;
  return {t:'tf',w,shown:truth?w:others[Math.random()*others.length|0],truth}})}
/* Construire la phrase : remettre les mots dans l'ordre */
const tilesOf=t=>fill(t).replace(/[¿?¡!.,«»:—]/g,' ').split(/\s+/).filter(Boolean);
function buildSteps(u,n){
  const c=[...u.talk.map(d=>({s:d.o.find(isOk)[0],p:d.p||''})),...u.gaps.map(g=>({s:g[0].replace('_',g[1]),p:g[3]}))]
    .filter(x=>{const k=tilesOf(x.s).length;return k>=3&&k<=7});
  return shuffle(c).slice(0,n).map(x=>{
    const ws=tilesOf(x.s),wn=ws.map(nw);
    const extra=u.tier>1?shuffle(u.words.flatMap(w=>tilesOf(w[0])).filter(y=>!wn.includes(nw(y)))).slice(0,1):[];
    return {t:'build',sent:x.s,p:x.p,target:ws,tiles:shuffle([...ws,...extra]),used:[]}});
}
function startUnit(i){
  const u=UNITS[i],words=shuffle(u.words.map(W)),learn=[],steps=[],phr=!!u.conv;
  if(!S.stars[u.id])words.forEach(w=>learn.push({t:'learn',w,conv:phr}));
  steps.push(matchStep(words));
  shuffle(words.slice()).slice(0,4).forEach(w=>steps.push({t:kindFor(w,phr),w,opts:optsFor(w,words)}));
  if(!u.conv)tfSteps(words,2).forEach(s=>steps.push(s));
  shuffle(u.gaps.slice()).forEach(g=>steps.push(gapStep(g)));
  buildSteps(u,2).forEach(s=>steps.push(s));
  shuffle(words.slice()).slice(0,u.tier>1?3:2).forEach(w=>steps.push({t:'speak',w}));
  u.talk.forEach(d=>steps.push({t:'talk',d,opts:shuffle(d.o.slice())}));
  L={unit:i,kind:'unit',steps:mix(u.id,learn,steps),i:0,mistakes:0,ok:0,answered:null,tries:0,t0:Date.now(),stk0:stickerCount()};view='lesson';render();
}
function startChat(){
  const steps=shuffle(learnedUnits().flatMap(u=>u.talk)).slice(0,6).map(d=>({t:'talk',d,opts:shuffle(d.o.slice())}));
  L={unit:-1,kind:'chat',steps,i:0,mistakes:0,ok:0,answered:null,tries:0,t0:Date.now(),stk0:stickerCount()};view='lesson';render();
}
function startReview(){
  const us=learnedUnits();
  const pool=uniqPic(shuffle(us.flatMap(u=>u.words.map(w=>Object.assign(W(w),{conv:u.conv||u.tier>1,c1:!!u.conv})))));
  const pk=shuffle(pool.slice()).slice(0,6),steps=[];
  if(pool.length>=4)steps.push(matchStep(pool));
  pk.slice(0,4).forEach((w,k)=>steps.push({t:k%2?'pick':(w.conv?'mean':'listen'),w,opts:optsFor(w,pool)}));
  tfSteps(pool.filter(w=>!w.c1),2).forEach(s=>steps.push(s));
  shuffle(us.flatMap(u=>u.gaps)).slice(0,2).forEach(g=>steps.push(gapStep(g)));
  shuffle(us.slice()).slice(0,2).forEach(u=>buildSteps(u,1).forEach(s=>steps.push(s)));
  pk.slice(4,6).forEach(w=>steps.push({t:'speak',w}));
  L={unit:-1,steps:mix('review',[],steps),i:0,mistakes:0,ok:0,answered:null,tries:0,t0:Date.now(),stk0:stickerCount()};view='lesson';render();
}

/* Séance du jour : les mots à revoir aujourd'hui (révision espacée), complétés par les mots les moins sûrs */
function startSeance(list){
  const WM=wordMap(),all=Object.values(WM);let pool=(list||dueList()).slice(0,8);
  if(pool.length<8){const have=new Set(pool.map(w=>w.es));pool=pool.concat(Object.keys(S.words||{}).filter(k=>WM[k]&&!have.has(k)).sort((a,b)=>S.words[a].b-S.words[b].b).map(k=>WM[k]).slice(0,8-pool.length))}
  if(!pool.length)return false;
  const steps=[];if(uniqPic(pool).length>=4)steps.push(matchStep(pool));
  shuffle(pool.slice()).forEach((w,k)=>steps.push(k%3===2?{t:'speak',w}:{t:k%2?'pick':(w.conv?'mean':'listen'),w,opts:optsFor(w,all)}));
  tfSteps(pool.filter(w=>!w.conv),2).forEach(s=>steps.push(s));
  L={unit:-1,kind:'seance',steps:mix('seance',[],steps),i:0,mistakes:0,ok:0,answered:null,tries:0,t0:Date.now(),stk0:stickerCount()};view='lesson';render();return true;
}
/* Évaluation de fin d'étape : 12 questions sur les 5 niveaux, 80 % pour ouvrir l'étape suivante */
function startEval(t){
  const us=stageUnits(t),words=uniqPic(shuffle(us.flatMap(u=>u.words.map(w=>Object.assign(W(w),{conv:!!u.conv})))));
  const steps=[];
  words.slice(0,8).forEach((w,k)=>steps.push({t:k%2?'pick':(w.conv?'mean':'listen'),w,opts:optsFor(w,words)}));
  const rest=words.slice(8).filter(w=>!w.conv);tfSteps(rest.length>=2?rest:words.filter(w=>!w.conv),2).forEach(s=>steps.push(s));
  shuffle(us.flatMap(u=>u.gaps)).slice(0,12-steps.length).forEach(g=>steps.push(gapStep(g)));
  L={unit:-1,kind:'eval',tier:t,steps:shuffle(steps),i:0,mistakes:0,ok:0,answered:null,tries:0,missed:[],t0:Date.now(),stk0:stickerCount()};view='lesson';render();
}

  L.answered=Object.assign({ok,msg},L.answered||{});L.answered.ok=ok;L.answered.msg=msg;render();

function matchLeft(k){const s=L.steps[L.i];const w=s.left[k];s.sel=w.es;say(w.es);render()}
function matchRight(k){
  const s=L.steps[L.i];if(L.answered)return;const w=s.right[k];
  if(!s.sel){s.bad=k;render();return}
  if(w.es===s.sel){s.done.push(w.es);srs(w,!(s.wr||[]).includes(w.es));s.sel=null;tone(true);
    if(s.done.length===s.ws.length){settle(s,s.err===0,s.err?'Tu as trouvé toutes les paires, avec un peu d\'aide.':'',()=>matchStep(s.ws));return}
    render();
  }else{s.err++;(s.wr=s.wr||[]).push(s.sel);s.sel=null;s.bad=k;tone(false);render()}
}
function tfAnswer(v){
  const s=L.steps[L.i];if(L.answered)return;L.answered={k:v};say(s.w.es);
  const ok=(v===1)===s.truth;srs(s.w,ok);if(!ok&&L.missed)L.missed.push(s.w);
  settle(s,ok,ok?'':(s.truth?`Oui, « ${esc(s.w.es)} » va bien avec l'image.`:`Non : l'image ne montre pas « ${esc(s.w.es)} ».`),
    ()=>({t:'tf',w:s.w,shown:s.shown,truth:s.truth}));
}
function buildTap(k){
  const s=L.steps[L.i];if(L.answered||s.used.includes(k))return;s.used.push(k);

  const ok=s.used.map(i=>nw(s.tiles[i])).join(' ')===s.target.map(nw).join(' ');

  settle(s,ok,`« ${esc(fill(s.sent))} »`,()=>({t:'build',sent:s.sent,p:s.p,target:s.target,tiles:shuffle(s.tiles.slice()),used:[]}));

function answer(k){
  const s=L.steps[L.i];if(L.answered)return;
  let ok,msg='';
  if(s.t==='talk'){const o=s.opts[k];ok=isOk(o);const right=s.opts.find(isOk);say(fill(right[0]));
    msg=ok?'':`La bonne réponse : « ${esc(fill(right[0]))} »`;}
  else if(s.t==='gap'){ok=s.opts[k]===s.g.a;const full=fill(s.g.s.replace('_',s.g.a));say(full);
    msg=`« ${esc(full)} »`;}
  else{const o=s.opts[k];ok=o.es===s.w.es;say(s.w.es);msg=`${esc(s.w.es)} = ${esc(s.w.fr)}`;srs(s.w,ok);if(!ok&&L.missed)L.missed.push(s.w);}
  tone(ok);
  if(ok)L.ok++;else{L.mistakes++;if(!s.retry&&L.kind!=='eval')L.steps.push(Object.assign({},s,{retry:1,opts:shuffle(s.opts.slice())}));}
  L.answered={ok,k,msg};render();

async function doMic(){
  const s=L.steps[L.i],btn=$('[data-act=mic]'),heard=$('#heard');if(!btn||btn.classList.contains('on'))return;
  try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  btn.classList.add('on');heard.innerHTML='<b>Je t\'écoute…</b> parle fort et bien clairement.';
  const LL=L,at=L.i;let alts;
  try{alts=await listen()}
  catch(err){
    btn.classList.remove('on');if(L!==LL||L.i!==at||view!=='lesson')return;
    if(/not-allowed|service-not-allowed|audio-capture/.test(err)){micOK=false;micDenied=true;L.res=null;L.micMsg='';render();return}
    L.micMsg=err==='no-speech'?"Je n'ai rien entendu. Appuie sur 🎤 et parle plus fort !":err==='network'?"Il faut Internet pour que "+G().es+" puisse t'écouter.":"Oups ! Appuie encore sur 🎤.";
    L.res=null;render();return;
  }
  btn.classList.remove('on');if(L!==LL||L.i!==at||view!=='lesson')return;
  if(!alts.length){L.micMsg="Je n'ai rien entendu. Appuie sur 🎤 et parle plus fort !";L.res=null;render();return}
  const r=analyze(alts,s.w.es);L.res=r;L.micMsg='';L.tries++;tone(r.pass);
  if(s.t==='learn'){
    if(r.pass)L.learnDone=true;
    else if(L.tries>=3){L.learnDone=true;L.mistakes++;L.steps.push({t:'speak',w:s.w,retry:1})}
    render();if(!r.pass)say(s.w.es,true);return;
  }
  if(r.pass){L.ok++;srs(s.w,true);L.answered={ok:true,msg:''};render();return}
  if(L.tries>=3){
    L.mistakes++;srs(s.w,false);if(!s.retry)L.steps.push({t:'speak',w:s.w,retry:1});
    L.answered={ok:false,msg:s.retry?'Pas validé cette fois. Tu le retravailleras dans une prochaine leçon.':'Pas encore validé : tu le redis à la fin de la leçon.'};
  }
  render();say(s.w.es,true);
}

/* ---------- Mini-jeux : Attrape les mots, Memory, Course contre la montre ---------- */
let GM=null;
function gamePool(){const WM=wordMap();return uniqPic(shuffle(Object.keys(S.words||{}).filter(k=>WM[k]).map(k=>WM[k])))}
function games(){
  const n=gamePool().length,ok=n>=4;
  app.innerHTML=head('🎮 Jeux')+`<p class="note" style="margin-bottom:12px">${ok?`On joue avec tes ${n} mots appris. Chaque partie rapporte des pièces 🪙.`:'Termine ta première leçon pour débloquer les jeux !'}</p>
  <div class="eplist">
   <button class="epi ${ok?'':'lock'}" data-act="game" data-g="catch"><span class="epn">🫧</span><span class="ept"><b>Attrape les mots</b><small>Touche la bonne bulle avant qu'elle tombe</small></span><span>▶</span></button>
   <button class="epi ${ok?'':'lock'}" data-act="game" data-g="memory"><span class="epn">🃏</span><span class="ept"><b>Memory</b><small>Retrouve chaque mot et son image</small></span><span>▶</span></button>
   <button class="epi ${ok?'':'lock'}" data-act="game" data-g="chrono"><span class="epn">⏱️</span><span class="ept"><b>Course contre la montre</b><small>Le plus de bonnes réponses en 45 secondes</small></span><span>▶</span></button></div>`;
}
function startGame(g){
  const pool=gamePool();if(pool.length<4)return;
  if(GM&&GM.timer)clearInterval(GM.timer);
  if(g==='catch'){GM={g,round:0,n:8,score:0,pool,t0:Date.now()};nextCatch()}
  else if(g==='memory'){const ws=pool.slice(0,6);GM={g,cards:shuffle(ws.flatMap(w=>[{w,k:'t'},{w,k:'p'}])),open:[],done:[],moves:0,pairs:ws.length,t0:Date.now()};view='game';render()}
  else{GM={g:'chrono',score:0,pool,end:Date.now()+45000,t0:Date.now()};nextChrono();
    GM.timer=setInterval(()=>{if(!GM||GM.g!=='chrono'||view!=='game'){clearInterval(GM&&GM.timer);return}
      if(Date.now()>=GM.end){clearInterval(GM.timer);endGame()}else{const b=$('#tbar');if(b)b.style.width=Math.max(0,(GM.end-Date.now())/450)+'%'}},200)}
}
function nextCatch(){
  if(!GM||GM.g!=='catch')return;if(GM.round>=GM.n)return endGame();
  const target=pick(GM.pool);GM.cur={target,opts:optsFor(target,GM.pool).map((w,i)=>({w,x:4+i*32+Math.random()*8,dur:(4.4+Math.random()*1.2).toFixed(2),delay:(Math.random()*.6).toFixed(2)}))};
  GM.round++;GM.lock=false;GM.miss=null;view='game';render();say(target.es);
}
function nextChrono(){const w=pick(GM.pool);GM.cur={w,opts:optsFor(w,GM.pool)};GM.lock=false;GM.bad=null;view='game';render()}
function game(){
  const g=GM;let body='';
  if(g.g==='catch'){const c=g.cur;body=`<div class="ghead"><span>Manche ${g.round} / ${g.n}</span><span>⭐ ${g.score}</span></div>
    <div class="ask" style="text-align:center">Attrape : <span class="es">${esc(c.target.es)}</span> <button class="tool" data-act="gsay" aria-label="Réécouter">🔊</button></div>
    <div class="sky">${c.opts.map((o,i)=>`<button class="bubble-f ${g.miss===i?'sel-bad':''} ${g.lock&&o.w===c.target?'sel-good':''}" data-act="gcatch" data-k="${i}" style="left:${o.x}%;animation-duration:${o.dur}s;animation-delay:${o.delay}s" aria-label="${esc(o.w.fr)}">${pic(o.w.e)}</button>`).join('')}</div>`}
  else if(g.g==='memory'){body=`<div class="ghead"><span>${g.done.length} / ${g.pairs} paires</span><span>${g.moves} coups</span></div>
    <div class="mem">${g.cards.map((c,i)=>{const up=g.open.includes(i)||g.done.includes(c.w.es);return `<button class="mcard ${up?'up':''} ${g.done.includes(c.w.es)?'ok':''}" data-act="gmem" data-k="${i}" aria-label="${up?esc(c.k==='t'?c.w.es:c.w.fr):'Carte cachée'}">${up?(c.k==='t'?`<b>${esc(c.w.es)}</b>`:pic(c.w.e)):'❓'}</button>`}).join('')}</div>`}
  else{const c=g.cur;body=`<div class="ghead"><span>⏱️ Course</span><span>⭐ ${g.score}</span></div><div class="bar"><i id="tbar" style="width:${Math.max(0,(g.end-Date.now())/450)}%;background:var(--coral)"></i></div>
    <div class="card" style="margin-top:14px"><div class="pic">${pic(c.w.e)}</div></div>
    <div class="opts" style="margin-top:14px">${c.opts.map((o,i)=>`<button class="opt ${g.bad===i?'sel-bad':''}" data-act="gchr" data-k="${i}">${esc(o.es)}</button>`).join('')}</div>`}
  app.innerHTML=`<div class="lbar"><button class="icon-btn" data-act="games" aria-label="Quitter le jeu">✕</button><b style="flex:1;font-family:var(--f-display);font-size:20px">${g.g==='catch'?'Attrape les mots':g.g==='memory'?'Memory':'Course contre la montre'}</b></div><div class="stage">${body}</div>`;
}
function catchTap(k){
  const g=GM,c=g.cur;if(!g||g.lock)return;g.lock=true;const o=c.opts[k],ok=o.w===c.target;
  srs(c.target,ok);tone(ok);if(ok)g.score++;else g.miss=k;render();setTimeout(nextCatch,ok?500:1100);
}
function memTap(k){
  const g=GM;if(!g||g.lock||g.open.includes(k)||g.done.includes(g.cards[k].w.es))return;
  g.open.push(k);if(g.cards[k].k==='t')say(g.cards[k].w.es);
  if(g.open.length<2){render();return}
  g.moves++;const [a,b]=g.open.map(i=>g.cards[i]);
  if(a.w.es===b.w.es&&a.k!==b.k){g.done.push(a.w.es);g.open=[];tone(true);srs(a.w,true);render();if(g.done.length===g.pairs)setTimeout(endGame,600);return}
  g.lock=true;render();setTimeout(()=>{if(GM!==g)return;g.open=[];g.lock=false;render()},950);
}
function chronoTap(k){
  const g=GM;if(!g||g.lock)return;const ok=g.cur.opts[k].es===g.cur.w.es;srs(g.cur.w,ok);tone(ok);
  if(ok){g.score++;nextChrono()}else{g.lock=true;g.bad=k;render();setTimeout(()=>{if(GM===g&&view==='game')nextChrono()},450)}
}
function endGame(){
  const g=GM;if(!g||g.over)return;g.over=true;if(g.timer)clearInterval(g.timer);
  const coins=g.g==='memory'?Math.max(3,12-(g.moves-g.pairs)):g.score,score=g.g==='memory'?g.done.length:g.score;
  addCoins(coins);addPts(coins);save();
  g.coins=coins;g.final=score;view='gameover';render();if(coins>=5)confetti();
}
function gameover(){
  const g=GM,txt=g.g==='memory'?`Toutes les paires en ${g.moves} coups !`:g.g==='catch'?`${g.final} mots attrapés sur ${g.n}`:`${g.final} bonnes réponses en 45 secondes`;
  app.innerHTML=`<div class="center"><div class="lola big" aria-hidden="true">${avatar()}</div><h2 style="font-size:36px">${g.final?'¡Muy bien!':'¡Casi!'}</h2>
  <div class="xp">${txt}</div><div class="xp" style="font-size:24px">+${g.coins} 🪙</div>
  <div style="width:100%;display:grid;gap:12px"><button class="btn sun" data-act="game" data-g="${g.g}">Rejouer</button><button class="btn ghost" data-act="games">Autres jeux</button><button class="btn" data-act="home">Retour à la carte</button></div></div>`;
}

function duelStart(){
  const pool=gamePool();if(pool.length<4||!DU||!DU.opp)return;
  const o=DU.opp==='parent'?{id:'parent',name:'Un parent',e:'🧑'}:(()=>{const s=profileInfo(DU.opp);return {id:DU.opp,name:s.name||'Joueur',e:(THEMES[s.theme]||THEMES.jungla).e}})();
  const qs=shuffle(pool.slice()).slice(0,8).map(w=>({w,opts:optsFor(w,pool)}));

function duel2(){

  const [a,b]=d.players,win=d.score[0]!==d.score[1]?(d.score[0]>d.score[1]?0:1):(d.time[0]<=d.time[1]?0:1);

function duelAnswer(es){
  const d=DU,q=d.qs[d.i];if(d.phase!=='q')return;const ok=es===q.w.es;tone(ok);if(ok)d.score[d.turn]++;
  if(d.turn===0)srs(q.w,ok);
  d.i++;if(d.i<d.qs.length){render();return}
  d.time[d.turn]=Date.now()-d.t0;
  if(d.turn===0){d.turn=1;d.i=0;d.phase='turn';render();return}
  d.phase='end';const win=d.score[0]!==d.score[1]?(d.score[0]>d.score[1]?0:1):(d.time[0]<=d.time[1]?0:1),wid=d.players[win].id;
  addPts(5);if(wid!=='parent')editProfile(wid,s=>{s.coins=(s.coins||0)+10;const k=weekKey();if(!s.wk||s.wk.k!==k)s.wk={k,pts:0};s.wk.pts+=10;s.xp=(s.xp||0)+10});
  save();render();confetti();
}

  else if(a==='plim'){const m=+b.dataset.m;editProfile(b.dataset.id,s=>{s.limit=m;delete s.unlockDay;delete s.extra});render()}
  else if(a==='punlock'){editProfile(b.dataset.id,s=>{s.unlockDay=dayPlus(0)});render()}
  else if(a==='unit'){const i=+b.dataset.i;if(!unlocked(i)){say('¡Todavía no!');return}if(!guard())return;startUnit(i);speakStep()}

  else if(a==='chat'){startChat();speakStep()}

  else if(a==='slow'){const s=L.steps[L.i];say(s.w.es,true)}

  else if(a==='next'){if(L.steps[L.i]&&L.steps[L.i].t==='learn')seen(L.steps[L.i].w);L.i++;L.answered=null;L.tries=0;L.res=null;L.micMsg='';L.learnDone=false;if(L.i>=L.steps.length)finish();else{render();speakStep()}}

  else if(a==='settings'){view='settings';render()}
  else if(a==='slowtog'){readName();S.slow=!S.slow;save();render()}
  else if(a==='goal'){readName();S.goal=+b.dataset.n;save();render()}

  else if(a==='resetyes'){const k=pkey(P.cur);try{localStorage.removeItem(k);localStorage.removeItem(k+'-secours')}catch(e){}S=def();migrate();applyTheme();confirmReset=false;view='welcome';render()}
