<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#169C98">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Petit Polyglotte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen kids' app, single bright "lagoon & sunflower" world, centered column max 520px, chunky tappable tiles */
:root{
  --bg:#E6F6F0; --bg2:#D3EEE5; --card:#FFFFFF; --ink:#16394A; --muted:#55767F; --line:#C4E2D8;
  --lagoon:#169C98; --lagoon-d:#0E7673; --sun:#FFC93C; --sun-d:#E0A510; --coral:#FF6F5E; --coral-d:#D9503F;
  --good:#23A55A; --good-bg:#DDF6E6; --bad:#E0464C; --bad-bg:#FDE3E3; --lock:#A9C3BC;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
button.lola{border:0;cursor:pointer;padding:0}
.ava{position:relative;display:inline-grid;place-items:center;line-height:1}
.ava-h{position:absolute;top:-.46em;left:50%;transform:translateX(-50%);font-size:.58em}
.ava-f{position:absolute;top:.2em;left:50%;transform:translateX(-50%);font-size:.42em}
.ava-x{position:absolute;right:-.42em;bottom:-.12em;font-size:.5em}
.lola.big .ava{font-size:70px}
img.fx{width:1.18em;height:1.18em;object-fit:contain;vertical-align:-.22em;display:inline-block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.pictxt{display:inline-block;max-width:100%;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.12;color:var(--lagoon-d);text-align:center;overflow-wrap:anywhere;padding:4px 6px}
.opts.pics .pictxt,.mpic .pictxt,.mcard .pictxt,.sticker .pictxt{font-size:15px;padding:2px}
.bubble-f .pictxt{font-size:11px;line-height:1.05;padding:2px}
.trad{background:var(--card);border-radius:14px;padding:8px 12px;margin:2px 0 10px;text-align:left;color:var(--ink)}
.trad p{margin:2px 0!important;font-size:16px;font-weight:700;line-height:1.35}
.frq{display:block;font-size:15px;font-weight:700;color:var(--muted);margin-top:4px;line-height:1.3}
.frq.big{font-size:18px;text-align:center;background:var(--card);border-radius:14px;padding:8px 12px;margin:10px 0 0;color:var(--ink)}
.custom{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.custom label{font-weight:800;font-size:15px}
.custom input{width:88px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:18px;text-align:center;padding:0 8px}
.custom.on input{border-color:var(--sun);background:var(--sun)}
.custom input.bad{border-color:var(--bad)}
.custom span{font-weight:700;color:var(--muted)}
.custom .tool{min-height:44px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg.three button{font-size:22px}
.tuto{min-height:300px;justify-content:center}
.tuto .tbig{font-size:76px;line-height:1.1}
.tuto .tbig .ava{font-size:76px}
#totop{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:52px;height:52px;border-radius:50%;border:0;background:var(--lagoon);color:#fff;font-size:28px;font-weight:800;box-shadow:0 4px 0 var(--lagoon-d),0 6px 16px rgba(0,0,0,.18);cursor:pointer}
#totop[hidden]{display:none}
.seg.two{grid-template-columns:repeat(2,1fr)}
.limit{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.limit b{font-size:16px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{min-width:0;min-height:52px;border-radius:14px;background:var(--bg2);font-weight:800;font-size:18px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;box-shadow:0 3px 0 var(--line)}
.seg button small{font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--sun);box-shadow:0 3px 0 var(--sun-d)}
.seg button.on small{color:var(--ink)}
.funbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.fun{background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:14px}
.fun span{font-size:30px;line-height:1.1}
.eplist{display:flex;flex-direction:column;gap:10px}
.epi{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:12px 14px;text-align:left;font-size:20px}
.epi.lock{opacity:.55}
.epn{flex:none;width:46px;height:46px;border-radius:14px;background:var(--bg2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px}
.ept{flex:1;min-width:0;display:flex;flex-direction:column}
.ept b{font-family:var(--f-display);font-size:19px;line-height:1.15}
.ept small{font-size:14px;font-weight:700;color:var(--muted)}
.panel{background:var(--card);border-radius:26px;box-shadow:0 6px 0 var(--line);padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;margin:8px 0 14px}
.pscene{display:flex;align-items:center;justify-content:center;gap:14px;font-size:64px;line-height:1.1;flex-wrap:wrap}
.pscene .pg{font-size:56px}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--lagoon)}
.kara{background:var(--card);border-radius:22px;box-shadow:0 5px 0 var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.kl{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.3;color:var(--muted);transition:color .2s,transform .2s}
.kl.on{color:var(--lagoon-d);transform:scale(1.03);transform-origin:left}
.kl.me{color:var(--coral-d)}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.sticker{aspect-ratio:1;border-radius:20px;background:var(--bg2);border:3px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;color:var(--muted);max-width:100%}
.sticker span{font-size:34px;line-height:1}
.sticker.on{background:var(--card);border:3px solid var(--sun);box-shadow:0 4px 0 var(--sun-d);color:var(--ink);transform:rotate(-2deg)}
.sticker.on:nth-child(2n){transform:rotate(2deg)}
.sticker.on .swatch{width:38px;height:38px;border-radius:10px}
.sticker b{font-size:13px;text-align:center;line-height:1.1;padding:0 4px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.item{background:var(--card);border-radius:18px;border:3px solid transparent;box-shadow:0 4px 0 var(--line);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.item span{font-size:34px;line-height:1.1}
.item b{font-size:14px;line-height:1.15;text-align:center}
.item small{font-size:13px;font-weight:800;color:var(--muted)}
.item.on{border-color:var(--good);background:var(--good-bg)}
.item.poor{opacity:.6}
.ghead{display:flex;justify-content:space-between;font-weight:800;font-size:17px}
.sky{position:relative;height:430px;overflow:hidden;border-radius:24px;background:linear-gradient(var(--bg2),var(--card));margin-top:6px}
.bubble-f{position:absolute;top:-96px;width:88px;height:88px;border-radius:50%;background:var(--card);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;font-size:48px;animation-name:fall2;animation-timing-function:linear;animation-fill-mode:forwards}
.bubble-f .swatch{width:56px;height:56px;border-radius:50%}
.bubble-f.sel-good{border-color:var(--good);background:var(--good-bg)}
.bubble-f.sel-bad{border-color:var(--bad);background:var(--bad-bg)}
@keyframes fall2{from{top:-96px}to{top:calc(100% + 4px)}}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.mcard{aspect-ratio:1;border-radius:18px;background:var(--lagoon);box-shadow:0 5px 0 var(--lagoon-d);color:#fff;font-size:34px;display:grid;place-items:center;max-width:100%;padding:4px}
.mcard.up{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);font-size:44px}
.mcard.up b{font-size:16px;line-height:1.15;overflow-wrap:anywhere}
.mcard.ok{background:var(--good-bg);box-shadow:0 5px 0 var(--good)}
.mcard .swatch{width:60%;height:60%;border-radius:12px}
.rank{display:flex;align-items:center;gap:10px;font-size:17px}
.rank .re{font-size:26px}
.rank b{flex:1;min-width:0}
.rank .rp{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.deco{text-align:center;font-size:20px;letter-spacing:6px;margin-top:10px;opacity:.85}
.badge{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:999px;background:#fff;color:var(--coral-d);font-size:15px;font-family:var(--f-body)}
.node.ev .disc{background:var(--sun);box-shadow:0 7px 0 var(--sun-d);font-size:36px}
.node.ev.done .disc{background:var(--good);box-shadow:0 7px 0 #17803F}
.node.ev.locked .disc{background:var(--lock);box-shadow:0 7px 0 #8FAAA3}
.evalhead{background:var(--sun);border-radius:14px;padding:8px 12px;font-weight:800;text-align:center}
.misslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;width:100%}
.big2{min-height:84px;font-size:22px}
.themes{display:grid;gap:12px;width:100%}
.thcard{display:flex;align-items:center;gap:14px;background:var(--tb);border:4px solid transparent;border-radius:22px;padding:12px 14px;text-align:left;box-shadow:0 5px 0 var(--tl)}
.thcard.on{border-color:var(--tl)}
.thmas{flex:none;width:72px;height:72px;border-radius:50%;background:var(--ts);display:grid;place-items:center;font-size:44px}
.thtxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.thtxt b{font-family:var(--f-display);font-size:22px;line-height:1.1}
.thtxt small{font-weight:700;color:var(--muted)}
.thdeco{font-size:18px;letter-spacing:3px}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;width:100%}
.pcard{background:var(--pb,var(--card));border:4px solid transparent;border-radius:22px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 var(--pc,var(--line))}
.pcard.cur{border-color:var(--pc)}
.pcard.add{background:var(--card);box-shadow:0 5px 0 var(--line)}
.pcard b{font-family:var(--f-display);font-size:20px}
.pcard small{font-weight:700;color:var(--muted);font-size:13px}
.pav{width:64px;height:64px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:38px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats div{background:var(--bg);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats small{font-weight:700;color:var(--muted);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:4px}
.barc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-width:0}
.barc i{display:block;width:100%;max-width:28px;min-height:3px;border-radius:6px 6px 2px 2px;background:var(--lagoon)}
.barc .bv{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.barc small{font-size:12px;font-weight:800;color:var(--muted)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:14px 24px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun-d);outline-offset:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:0 22px;border-radius:18px;font-family:var(--f-display);font-weight:800;font-size:22px;
  background:var(--lagoon);color:#fff;box-shadow:0 5px 0 var(--lagoon-d);transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--lagoon-d)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-d)}
.btn.coral{background:var(--coral);box-shadow:0 5px 0 var(--coral-d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn[disabled]{background:var(--lock);box-shadow:0 5px 0 #8FAAA3;opacity:.8}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}

/* Home */
.top{display:flex;align-items:center;gap:12px}
.lola{width:68px;height:68px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 60%,#FFE7A0 0 55%,var(--sun) 56%);display:grid;place-items:center;font-size:42px}
.lola.big{width:120px;height:120px;font-size:76px}
.hello{flex:1;min-width:0}
.hello small{color:var(--muted);font-weight:700;font-size:14px;display:block}
.hello h1{font-size:30px}
.icon-btn{width:48px;height:48px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:22px;display:grid;place-items:center;flex:none}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums}
.goal{margin-top:14px;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 4px 0 var(--line)}
.goal-h{display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.goal-h span:last-child{color:var(--muted)}
.bar{height:14px;background:var(--bg2);border-radius:999px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:999px;transition:width .4s}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.quick .btn{font-size:19px;min-height:62px;padding:0 10px}
.quick .wide{grid-column:1/-1}
.node .disc.conv{background:var(--coral);box-shadow:0 7px 0 var(--coral-d)}
.ctag{font-size:12px;font-weight:800;color:var(--coral-d);background:#FFE4E0;border-radius:999px;padding:2px 10px}
.map{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:26px;padding-bottom:20px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;width:150px}
.node .disc{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:var(--lagoon);box-shadow:0 7px 0 var(--lagoon-d);transition:transform .08s}
.node:active .disc{transform:translateY(4px)}
.node.done .disc{background:var(--sun);box-shadow:0 7px 0 var(--sun-d)}
.node.locked .disc{background:var(--lock);box-shadow:0 7px 0 #8FAAA3;filter:grayscale(.7);font-size:30px}
.node.current .disc{animation:bob 1.6s ease-in-out infinite;outline:5px solid #fff;outline-offset:3px}
.node b{font-family:var(--f-display);font-size:18px;line-height:1.1;text-align:center}
.node em{font-style:normal;font-size:13px;color:var(--muted);font-weight:700;text-align:center}
.stars{font-size:16px;letter-spacing:2px;min-height:20px}
.node.wait .start-tag{background:var(--lagoon)}
.seg.six{grid-template-columns:repeat(6,1fr);gap:5px}
.seg.six button{font-size:16px}
.seg.four{grid-template-columns:repeat(2,1fr)}
.seg.four button{font-size:16px;min-height:46px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px;background:var(--bg2);padding:5px;border-radius:16px}
.tabs button{min-height:44px;border-radius:12px;font-weight:800;font-size:15px;background:transparent}
.tabs button.on{background:var(--card);box-shadow:0 2px 0 var(--line)}
.thcard.poor{opacity:.6}
.ava-n{position:absolute;bottom:.02em;left:50%;transform:translateX(-50%);font-size:.38em}
.ava-e{position:absolute;inset:-.25em;font-size:.36em;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-.25em)}}
.sk-candy .ava-b{filter:hue-rotate(290deg) saturate(1.6)}
.sk-ice .ava-b{filter:hue-rotate(170deg) saturate(.8) brightness(1.15)}
.sk-sun .ava-b{filter:hue-rotate(25deg) saturate(2) brightness(1.08)}
.sk-night .ava-b{filter:hue-rotate(210deg) saturate(1.3) brightness(.75) drop-shadow(0 0 .08em #7aa2ff)}
.sk-ghost .ava-b{filter:grayscale(1) brightness(1.35) opacity(.75)}
.sk-gold .ava-b{filter:sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.05) drop-shadow(0 0 .08em #ffd54f)}
.sk-rainbow .ava-b{animation:rainbow 4s linear infinite}
@keyframes rainbow{from{filter:hue-rotate(0deg) saturate(1.6)}to{filter:hue-rotate(360deg) saturate(1.6)}}
.item .ava{font-size:34px}
.epi .price{font-weight:800;font-size:15px;white-space:nowrap}
.dprev{display:block;width:44px;height:34px;border-radius:10px;background:linear-gradient(var(--bg2),var(--card));border:2px solid var(--line)}
.deco-ocean .dprev,.deco-ocean .sky{background:linear-gradient(#b3e5fc,#4fc3f7)}
.deco-space .dprev,.deco-space .sky{background:linear-gradient(#1a237e,#5c6bc0)}
.deco-candy .dprev,.deco-candy .sky{background:linear-gradient(#fce4ec,#f8bbd0)}
.deco-forest .dprev,.deco-forest .sky{background:linear-gradient(#dcedc8,#81c784)}
.deco-ocean .mcard:not(.up){background:#0288d1;box-shadow:0 5px 0 #01579b}
.deco-space .mcard:not(.up){background:#283593;box-shadow:0 5px 0 #1a237e}
.deco-candy .mcard:not(.up){background:#ec407a;box-shadow:0 5px 0 #ad1457}
.deco-forest .mcard:not(.up){background:#43a047;box-shadow:0 5px 0 #1b5e20}
.spell{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0}
.sl{width:36px;height:46px;border-bottom:4px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px}
.sl.ok{color:var(--good);border-color:var(--good)}
.sl.bad{color:var(--bad);border-color:var(--bad)}
@media (prefers-reduced-motion:reduce){.ava-e,.sk-rainbow .ava-b{animation:none}}
select{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:0 10px;width:100%}
.slogan{margin:4px 0 10px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.25;color:var(--lagoon-d);text-wrap:balance}
.slogan.par{margin:0 0 6px;text-align:left;font-size:19px;color:var(--good)}
.accs{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
details.acc{background:var(--card);border-radius:22px;box-shadow:0 5px 0 var(--line);overflow:hidden}
details.acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;min-height:64px}
details.acc summary::-webkit-details-marker{display:none}
.acc-t{flex:1;min-width:0;display:flex;flex-direction:column}
.acc-t b{font-size:20px;font-family:var(--f-display)}
.acc-t small{font-size:14px;font-weight:700;color:var(--muted)}
.chev{font-size:22px;color:var(--muted);transition:transform .2s}
details.acc[open] .chev{transform:rotate(180deg)}
.accs{display:grid;gap:12px;margin-top:12px}

/* ---------- Analyse de la prononciation ----------
   La reconnaissance espagnole (es-ES) transcrit ce qu'elle comprend. On compare mot par mot avec la phrase attendue,
   on pondère par la confiance du moteur, et on ne valide que si tous les mots sont reconnus. */
const PASS=75,ART=['el','la','los','las','un','una'];
const nw=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}
const TIPS=[
 [/rr|^r/,'Le R espagnol se roule avec le bout de la langue : « rrr », comme un petit moteur !'],
 [/j|g[ei]/,'Le J se dit au fond de la gorge, comme quand on souffle sur ses lunettes : « kh ».'],
 [/ñ/,'Le Ñ se dit « gn », comme dans « montagne ».'],
 [/ll/,'Le LL se dit « y », comme dans « yoyo ».'],
 [/z|c[ei]/,'Le Z (et le C devant E ou I) se dit avec la langue entre les dents.'],
 [/r/,'Le R espagnol se fait avec le bout de la langue derrière les dents, pas dans la gorge.'],
 [/^h/,'Le H ne se prononce jamais en espagnol.'],
 [/v/,'Le V espagnol se dit presque comme un B.'],
 [/u/,'Le U espagnol se dit toujours « ou ».'],
 [/e/,'Le E espagnol se dit toujours « é » : perro se dit « pé-rro ».']];
function tipFor(ws){for(const w of ws)for(const [re,t] of TIPS)if(re.test(w))return t;return 'Écoute '+G().es+' en lent 🐢, puis répète syllabe par syllabe.'}
function analyze(alts,target){
  const raw=fill(target).replace(/[¿?¡!.,«»:—]/g,' ').split(/\s+/).filter(Boolean);
  let words=raw.filter(w=>!ART.includes(w.toLowerCase())).map(w=>({raw:w,n:nw(w)}));
  if(!words.length)words=raw.map(w=>({raw:w,n:nw(w)}));
  const T=words.map(w=>w.n).join(' ');
  let best={score:0,alt:alts[0]?alts[0].t:'',words:words.map(w=>({raw:w.raw,ok:false}))};
  alts.slice(0,1).forEach((a,k)=>{ /* seule la meilleure transcription compte : pas de rattrapage par les variantes */
    const aw=a.t.split(/\s+/).map(nw).filter(x=>x&&!ART.includes(x)),A=aw.join(' ');
    const sim=Math.max(0,1-lev(A,T)/Math.max(A.length,T.length,1));
    const wk=words.map(w=>({raw:w.raw,ok:aw.some(x=>x===w.n||(w.n.length>5&&lev(x,w.n)<=1))}));
    let sc=0.5*sim+0.5*wk.filter(x=>x.ok).length/wk.length;
    if(k===0&&a.c>0)sc*=0.8+0.2*Math.min(1,a.c/0.85);
    if(k>0)sc*=0.9;
    sc=Math.round(sc*100);
    if(sc>best.score)best={score:sc,alt:a.t,words:wk};
  });
  const miss=best.words.filter(w=>!w.ok);
  best.pass=best.score>=PASS&&miss.length<=(words.length>=5?1:0);
  best.tip=tipFor((miss.length?miss:best.words).map(w=>w.raw.toLowerCase()));
  return best;
}
function scoreHTML(r){

    <div class="meter"><i style="width:${r.score}%"></i><em style="left:${PASS}%"></em></div>

}

/* ---------- Construction d'une leçon ---------- */
/* Les exercices (après la découverte des mots) sont mélangés : ordre différent pour chaque enfant
   et jamais deux fois de suite le même enchaînement (S.seq garde le dernier, par leçon). */
const sigOf=s=>s.t+':'+(s.w?s.w.es:s.g?s.g.s:s.d?s.d.l:s.sent||(s.ws||[]).map(w=>w.es).join(','));
function mix(key,head,rest){
  /* v27 : l'ordre des exercices change à chaque lancement ; on refuse aussi de recommencer par les 3 mêmes exercices que la fois d'avant */
  S.seq=S.seq||{};const old=S.seq[key]||'',oldHead=old.split('|').slice(head.length,head.length+3).join('|');let steps,sig;
  for(let n=0;n<20;n++){steps=head.concat(shuffle(rest.slice()));const sg=steps.map(sigOf);sig=sg.join('|');
    if(sig!==old&&(rest.length<4||sg.slice(head.length,head.length+3).join('|')!==oldHead))break}
  S.seq[key]=sig;return steps;
}
const kindFor=(w,conv)=>Math.random()<.5?'pick':(conv?'mean':'listen');
const uniqPic=arr=>{const seen=new Set();return arr.filter(w=>!seen.has(w.e)&&seen.add(w.e))};
function optsFor(w,pool){return shuffle([w,...uniqPic(shuffle(pool.filter(x=>x.es!==w.es&&x.e!==w.e))).slice(0,2)])}
const gapStep=g=>({t:'gap',g:{s:g[0],a:g[1],e:g[3]},opts:shuffle([g[1],...g[2]])});
/* Associer les paires : 4 mots ↔ 4 images */
function matchStep(pool){const ws=uniqPic(shuffle(pool.slice())).slice(0,4);return {t:'match',ws,left:shuffle(ws.slice()),right:shuffle(ws.slice()),done:[],sel:null,err:0,bad:null}}
/* Vrai ou faux : la phrase entendue correspond-elle à l'image ? */
function tfSteps(pool,n){return shuffle(pool.slice()).slice(0,n).map(w=>{
  const others=pool.filter(x=>x.e!==w.e);const truth=!others.length||Math.random()<.5;
  return {t:'tf',w,shown:truth?w:others[Math.random()*others.length|0],truth}})}
/* Construire la phrase : remettre les mots dans l'ordre */
const tilesOf=t=>fill(t).replace(/[¿?¡!.,«»:—]/g,' ').split(/\s+/).filter(Boolean);
function buildSteps(u,n,fr){
  const c=[...u.talk.map(d=>({s:d.o.find(isOk)[0],p:d.p||''})),...u.gaps.map(g=>({s:g[0].replace('_',g[1]),p:g[3]})),...(u.phr?u.words.map(w=>({s:w[0],p:w[2]})):[])]
    .filter(x=>{const k=tilesOf(x.s).length;return k>=3&&k<=(u.phr?8:7)});
  const seen=new Set();
  return shuffle(c).filter(x=>!seen.has(x.s)&&seen.add(x.s)).slice(0,n).map(x=>{
    const ws=tilesOf(x.s),wn=ws.map(nw);
    const extra=u.tier>1?shuffle(u.words.flatMap(w=>tilesOf(w[0])).filter(y=>!wn.includes(nw(y)))).slice(0,u.phr?2:1):[];
    return {t:'build',sent:x.s,p:x.p,target:ws,tiles:shuffle([...ws,...extra]),used:[],fr:!!fr}});
}
function startUnit(i,uo){
  const u=uo||UNITS[i],words=shuffle(u.words.map(W)),learn=[],steps=[],phr=!!u.conv;
  shuffle(words.filter(w=>!S.stars[u.id]||!(S.words||{})[w.es])).forEach(w=>learn.push({t:'learn',w,conv:phr}));
  steps.push(matchStep(words.slice(0,5)));if(words.length>6)steps.push(matchStep(words.slice(5)));
  shuffle(words.slice()).slice(0,5).forEach(w=>steps.push({t:kindFor(w,phr),w,opts:optsFor(w,words)}));
  if(!u.conv)tfSteps(words,3).forEach(s=>steps.push(s));
  shuffle(u.gaps.slice()).forEach(g=>steps.push(gapStep(g)));
  if(u.phr){const bs=buildSteps(u,5);bs.forEach((s,k)=>{if(k<2)s.fr=true;steps.push(s)})}   /* phrases : 3 à écouter, 2 à traduire */
  else buildSteps(u,2).forEach(s=>steps.push(s));
  shuffle(words.slice()).slice(0,u.tier>1?3:2).forEach(w=>steps.push({t:'speak',w}));
  u.talk.forEach(d=>steps.push({t:'talk',d,opts:shuffle(d.o.slice())}));
  L={unit:uo?-1:i,u:uo||null,kind:'unit',steps:mix(u.id,learn,steps),i:0,mistakes:0,ok:0,answered:null,tries:0,t0:Date.now(),stk0:stickerCount()};view='lesson';render();
}
function startChat(){
  const steps=shuffle(learnedUnits().flatMap(u=>u.talk)).slice(0,6).map(d=>({t:'talk',d,opts:shuffle(d.o.slice())}));
  L={unit:-1,kind:'chat',steps,i:0,mistakes:0,ok:0,answered:null,tries:0,t0:Date.now(),stk0:stickerCount()};view='lesson';render();
}
function startReview(){
  const us=learnedUnits();
  const pool=uniqPic(shuffle(us.flatMap(u=>u.words.map(w=>Object.assign(W(w),{conv:u.conv||u.tier>1,c1:!!u.conv})))));
  const pk=shuffle(pool.slice()).slice(0,6),steps=[];
  if(pool.length>=4)steps.push(matchStep(pool));
  pk.slice(0,4).forEach((w,k)=>steps.push({t:k%2?'pick':(w.conv?'mean':'listen'),w,opts:optsFor(w,pool)}));
  tfSteps(pool.filter(w=>!w.c1),2).forEach(s=>steps.push(s));
  shuffle(us.flatMap(u=>u.gaps)).slice(0,2).forEach(g=>steps.push(gapStep(g)));
  shuffle(us.slice()).slice(0,2).forEach(u=>buildSteps(u,1).forEach(s=>steps.push(s)));
  pk.slice(4,6).forEach(w=>steps.push({t:'speak',w}));
  L={unit:-1,steps:mix('review',[],steps),i:0,mistakes:0,ok:0,answered:null,tries:0,t0:Date.now(),stk0:stickerCount()};view='lesson';render();
}

/* Séance du jour : les mots à revoir aujourd'hui (révision espacée), complétés par les mots les moins sûrs */
function startSeance(list){
  const WM=wordMap(),all=Object.values(WM);let pool=(list||dueList()).slice(0,8);
  if(pool.length<8){const have=new Set(pool.map(w=>w.es));pool=pool.concat(Object.keys(S.words||{}).filter(k=>WM[k]&&!have.has(k)).sort((a,b)=>S.words[a].b-S.words[b].b).map(k=>WM[k]).slice(0,8-pool.length))}
  if(!pool.length)return false;
  const steps=[];if(uniqPic(pool).length>=4)steps.push(matchStep(pool));
  shuffle(pool.slice()).forEach((w,k)=>steps.push(k%3===2?{t:'speak',w}:{t:k%2?'pick':(w.conv?'mean':'listen'),w,opts:optsFor(w,all)}));
  tfSteps(pool.filter(w=>!w.conv),2).forEach(s=>steps.push(s));
  L={unit:-1,kind:'seance',steps:mix('seance',[],steps),i:0,mistakes:0,ok:0,answered:null,tries:0,t0:Date.now(),stk0:stickerCount()};view='lesson';render();return true;
}
/* Évaluation de fin d'étape : 12 questions sur les 5 niveaux, 80 % pour ouvrir l'étape suivante */
function startEval(t){
  const us=stageUnits(t),words=uniqPic(shuffle(us.flatMap(u=>u.words.map(w=>Object.assign(W(w),{conv:!!u.conv})))));
  const steps=[];
  words.slice(0,8).forEach((w,k)=>steps.push({t:k%2?'pick':(w.conv?'mean':'listen'),w,opts:optsFor(w,words)}));
  const rest=words.slice(8).filter(w=>!w.conv);tfSteps(rest.length>=2?rest:words.filter(w=>!w.conv),2).forEach(s=>steps.push(s));
  shuffle(us.flatMap(u=>u.gaps)).slice(0,12-steps.length).forEach(g=>steps.push(gapStep(g)));
  L={unit:-1,kind:'eval',tier:t,steps:shuffle(steps),i:0,mistakes:0,ok:0,answered:null,tries:0,missed:[],t0:Date.now(),stk0:stickerCount()};view='lesson';render();
}

const strip=es=>es.replace(/^(el|la|los|las) /i,'');

}

}
function nextChrono(){const w=pick(GM.pool);GM.cur={w,opts:optsFor(w,GM.pool)};GM.lock=false;GM.bad=null;view='game';render()}
function nextLetters(){
  if(GM.round>=GM.n)return endGame();

function nextTfx(){const w=pick(GM.pool),other=pick(GM.pool.filter(x=>x!==w)),truth=Math.random()<.5;GM.cur={w,show:truth?w:other,truth};GM.lock=false;GM.bad=null;view='game';render()}

function catchTap(k){
  const g=GM,c=g.cur;if(!g||g.lock)return;g.lock=true;const o=c.opts[k],ok=o.w===c.target;g.msg='';

function memTap(k){

/* Code parent (4 chiffres), un seul par téléphone (clé hola-lola-pin). Sans code, ou code oublié :

const PINK='hola-lola-pin';
const pinHash=c=>{let h=5381;for(const ch of 'hola-lola:'+c)h=((h*33)^ch.charCodeAt(0))>>>0;return h.toString(36)};
const getPin=()=>{try{return localStorage.getItem(PINK)}catch(e){return null}};
const setPin=c=>{try{localStorage.setItem(PINK,pinHash(c))}catch(e){}};
let gateMode='pin';
/* Question secrète (v23) : choisie avec le code, elle remplace la multiplication en cas d'oubli.
   Clé hola-lola-pinq = {q: n° de question, h: empreinte de la réponse}. 5 erreurs → 1 minute d'attente. */
const PINQ='hola-lola-pinq',PINLOCK='hola-lola-pinlock';
const SECRET_Q=["Ville de naissance d'un parent ?","Prénom de votre premier animal ?","Rue de votre enfance ?","Plat préféré d'un parent ?","Prénom d'un grand-parent ?"];
const normAns=t=>(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const getQ=()=>{try{return JSON.parse(localStorage.getItem(PINQ)||'null')}catch(e){return null}};
const setQ=(q,a)=>{try{localStorage.setItem(PINQ,JSON.stringify({q,h:pinHash('q:'+normAns(a))}))}catch(e){}};
let gateFails=0;
function inlineMsg(id,m){const e=document.getElementById(id);if(e){e.textContent=m;return true}return false}
const lockLeft=()=>{let u=0;try{u=+localStorage.getItem(PINLOCK)||0}catch(e){}return Math.max(0,Math.ceil((u-Date.now())/1000))};
function gateFail(msg){gateFails++;if(gateFails>=5){gateFails=0;try{localStorage.setItem(PINLOCK,String(Date.now()+60000))}catch(e){}}gateMsg=msg}
const qFields=()=>`<label class="field" for="pq">Question secrète (si vous oubliez le code)<select id="pq">${SECRET_Q.map((q,i)=>`<option value="${i}">${q}</option>`).join('')}</select></label>
    <label class="field" for="pa">Réponse<input id="pa" autocomplete="off"></label>`;
/* lit et vérifie code + question ; renvoie un message d'erreur ou '' */
function readNewPin(withQ){const c1=(($('#pn1')||{}).value||'').trim(),c2=(($('#pn2')||{}).value||'').trim();
  if(!/^\d{4}$/.test(c1))return 'Le code doit faire 4 chiffres.';if(c1!==c2)return 'Les deux codes ne sont pas pareils.';
  if(withQ){const a=(($('#pa')||{}).value||'');if(normAns(a).length<2)return 'Écrivez une réponse à la question secrète.';setQ(+(($('#pq')||{}).value||0),a)}
  setPin(c1);return ''}
function openGate(next){readName();gateNext=next||null;gateMode=getPin()?'pin':'new';gateQ=null;gateMsg='';popen=null;view='pgate';render()}
function gatePass(){if(getPin()&&!getQ()){gateMode='setq';gateMsg='';render();return}

function parentGate(){

  const ga=gateNext&&gateNext.act,back=ga==='addlang'?'langs':ga&&ga!=='reset'?'who':'settings',title=ga==='addlang'?'Ajouter une langue':ga&&ga!=='reset'?'Choisir le joueur':'Espace parent';
